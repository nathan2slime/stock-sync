apiVersion: apps/v1
kind: Deployment

metadata:
  name: stock-sync-service
  labels:
    app.kubernetes.io/name: stock-sync-service
    app.kubernetes.io/part-of: stock-sync

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: stock-sync-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-sync-service
        app.kubernetes.io/part-of: stock-sync

    spec:
      containers:
        - name: stock-sync-service
          image: stock-sync-service:latest
          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: stock-sync-config
            - secretRef:
                name: stock-sync-secrets

          ports:
            - name: http
              containerPort: 5400

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

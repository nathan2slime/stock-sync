apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: stock-sync-postgres
  labels:
    app.kubernetes.io/name: stock-sync-postgres
    app.kubernetes.io/part-of: stock-sync

spec:
  serviceName: stock-sync-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: stock-sync-postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-sync-postgres
        app.kubernetes.io/part-of: stock-sync

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: stock-sync-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stock-sync-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-sync-secrets
                  key: POSTGRES_PASSWORD

          ports:
            - name: postgres
              containerPort: 5432

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

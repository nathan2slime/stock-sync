name: CI Type Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Check service types
        run: pnpm --filter service checktype
